site_name: Step Engine Documentation
site_url: https://nathanaung.github.io/DX11GameEngine/
theme:
  name: material
  logo: assets/StepEngineIcon.svg
  favicon: assets/StepEngineIcon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true

nav:
  - Home: index.md
  - Architecture:
      - Core Engine Loop & Lifecycle: architecture/engine-loop.md
      - ECS & Entity Management: architecture/ecs.md
      - Rendering Pipeline & Shaders: architecture/rendering-pipeline.md
      - Subsystems, Physics, Audio & VFS: architecture/subsystems.md
  - API Reference:
      - Core, Scene, Systems & Serialization: api/core-and-scene.md
      - ECS Components & Enums: api/components.md
      - Renderer, Managers & Editor UI: api/managers-and-renderer.md
      - Lua Scripting Bindings: api/lua-scripting.md
  - Guides:
      - Adding & Managing Assets: guides/adding-assets.md
      - Creating, Editing & Exporting Scenes: guides/creating-scenes.md
      - Writing Lua Gameplay Scripts: guides/writing-scripts.md

repo_name: NathanAung/DX11GameEngine
repo_url: https://github.com/NathanAung/DX11GameEngine


copyright: Copyright &copy; Zayar Aung. All rights reserved.
